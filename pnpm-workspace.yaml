packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@leeoniya/ufuzzy": ^1.0.19
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-router": ^1.168.0
  "@types/diff": ^8.0.0
  "@types/node": ^24
  anser: ^2.3.5
  diff: ^9.0.0
  highlight.js: ^11.11.1
  marked-react: ^4.0.0
  motion: ^13.1.0
  mermaid: ^11.16.1
  react-arborist: ^3.16.0
  react-icons: ^5.7.0
  remend: ^1.3.0
  typescript: ^7.0.2
  use-stick-to-bottom: ^1.1.6
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@google/genai": set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false
